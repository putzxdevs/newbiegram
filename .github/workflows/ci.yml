name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: uv tool install ruff==0.17.1

      - name: Ruff check
        run: ruff check --output-format=github .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        # A dedicated venv keeps the console scripts (pytest) on PATH and
        # avoids relying on whatever Python the runner happens to expose.
        run: uv venv .venv --python ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: |
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python pytest pytest-asyncio pytest-timeout aiosqlite pyaes

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v --timeout=600

  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Assert the wheel carries the source version
        # PKG-INFO at the repo root used to shadow this and ship a 0.2.8 wheel.
        run: |
          set -euo pipefail
          # Hatch derives the version from newbiegram/__init__.py ([tool.hatch.version]),
          # so read it from source: the package is not installed at this point, so
          # `import newbiegram` would fail on its missing dependencies.
          version=$(sed -n 's/^__version__ *= *.\(.*\).$/\1/p' newbiegram/__init__.py)
          echo "source version: ${version}"
          ls dist/ | grep -F "${version}" || {
            echo "::error::No distribution built for version ${version}"
            ls dist/
            exit 1
          }

      - name: Install the wheel and smoke-test the import
        run: |
          set -euo pipefail
          uv venv /tmp/wheeltest --python 3.12
          uv pip install --python /tmp/wheeltest/bin/python dist/*.whl
          /tmp/wheeltest/bin/python -c "import newbiegram; print(newbiegram.__version__)"